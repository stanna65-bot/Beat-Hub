<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ producer['name'] }} — Beats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#120E1A; --card:#1C1626; --line:#2E2438; --gold:#FFB800; --pink:#FF3D6E; --teal:#00D9A3; --text:#F5F1E8; --muted:#8A8296; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: 'Inter', -apple-system, sans-serif; }
  .stripe { height:6px; background: repeating-linear-gradient(-45deg, var(--gold) 0 18px, var(--pink) 18px 36px, var(--teal) 36px 54px); }
  .header { padding: 34px 20px 22px; text-align:center; }
  .header img { width:84px; height:84px; border-radius:50%; object-fit:cover; border:2px solid var(--gold); }
  .header h1 { font-family:'Bebas Neue', sans-serif; letter-spacing:0.02em; margin:14px 0 6px; font-size:clamp(32px,8vw,44px);
    background: linear-gradient(90deg, var(--gold), var(--pink) 60%, var(--teal)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .header p { margin:0; color:var(--muted); font-size:14px; max-width:420px; margin:0 auto; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap:14px; padding: 20px; max-width: 900px; margin: 0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; text-decoration:none; color:inherit; display:block; transition: transform .15s; }
  .card:active { transform: scale(0.97); }
  .card img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
  .card .info { padding:10px 12px; }
  .card .title { font-size:14px; font-weight:600; margin:0 0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .price { font-family:'Space Mono', monospace; font-size:13px; color:var(--teal); font-weight:700; margin:0; }
  .empty { text-align:center; color:var(--muted); padding:60px 20px; }
</style>
</head>
<body>
  <div class="stripe"></div>
  <div class="header">
    {% if producer['profile_photo'] %}
      <img src="{{ producer['profile_photo'] }}" alt="{{ producer['name'] }}" />
    {% endif %}
    <h1>{{ producer['name'] }}</h1>
    {% if producer['bio'] %}<p>{{ producer['bio'] }}</p>{% endif %}
  </div>

  {% if beats %}
  <div class="grid">
    {% for beat in beats %}
    <a class="card" href="/p/{{ producer['slug'] }}/beat/{{ beat['id'] }}">
      <img src="{{ beat['cover_path'] }}" alt="{{ beat['title'] }}" />
      <div class="info">
        <p class="title">{{ beat['title'] }}</p>
        <p class="price">KES {{ beat['price'] }}</p>
      </div>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <div class="empty">No beats uploaded yet.</div>
  {% endif %}
</body>
</html>
