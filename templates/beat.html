{% extends 'base.html' %}{% block body %}<div class="nav"><a class="brand" href="/p/{{producer['slug']}}">← {{producer['name']}}</a></div><div style="display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1fr);gap:35px;padding-top:35px"><img src="{{beat['cover_path']}}" style="width:100%;border-radius:18px;aspect-ratio:1;object-fit:cover"><div><div class="muted">{{beat['genre']}} {% if beat['bpm'] %}· {{beat['bpm']}} BPM{% endif %}</div><h1 style="font:60px 'Bebas Neue';margin:8px 0">{{beat['title']}}</h1>{% if beat['is_hot_pick'] %}<p style="color:var(--gold)">🔥 HOT PICK</p>{% endif %}<audio controls preload="metadata" src="{{beat['audio_path']}}" style="width:100%;margin:15px 0"></audio><div class="card"><h2>KES {{beat['price']}}</h2><form id="buy"><label>M-Pesa number</label><input name="phone" placeholder="07XXXXXXXX" required><button class="btn" type="submit">Pay with M-Pesa</button></form><p id="status" class="muted"></p></div></div></div><script>const f=document.getElementById('buy'),st=document.getElementById('status');f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/checkout/{{beat["id"]}}',{method:'POST',body:new URLSearchParams(new FormData(f))});const d=await r.json();if(!r.ok){st.textContent=d.detail||'Payment could not start';return}st.textContent='Payment request sent. Confirm on your phone...';const timer=setInterval(async()=>{const x=await fetch('/order/'+d.order_id+'/status'),s=await x.json();if(s.status==='completed'){clearInterval(timer);st.innerHTML='<a class="btn" href="/download/'+s.download_token+'">Download your beat</a>'}else if(s.status==='failed'){clearInterval(timer);st.textContent='Payment failed. Please try again.'}},2000)}</script><style>@media(max-width:700px){body div[style*='minmax(280px']{grid-template-columns:1fr!important}}</style>{% endblock %}
