{% extends "base.html" %}{% block body %}<div style="max-width:650px;margin:50px auto" class="card"><h1>{{beat.title}}</h1><p class="muted">By {{profile.name}} · {{beat.genre}}</p><audio controls style="width:100%" src="{{beat.audio_path}}"></audio><div class="amount">KES {{beat.price}}</div><form id="f"><input name="phone" placeholder="M-Pesa number" required><button>Pay & Buy</button></form><p id="msg"></p></div><script>f.onsubmit=async e=>{e.preventDefault();let x=await fetch('/checkout/{{beat.id}}',{method:'POST',body:new FormData(f)});let d=await x.json();if(!x.ok){msg.textContent=d.detail||'Payment failed';return}msg.textContent='Payment prompt started. Checking...';let t=setInterval(async()=>{let s=await (await fetch('/order/'+d.order_id+'/status')).json();if(s.status==='completed'){clearInterval(t);location='/download/'+s.download_token}},1000)}</script>{% endblock %}
