<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ beat['title'] }} — {{ producer['name'] }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#120E1A; --card:#1C1626; --line:#2E2438; --gold:#FFB800; --pink:#FF3D6E; --teal:#00D9A3; --text:#F5F1E8; --muted:#8A8296; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: 'Inter', -apple-system, sans-serif; }
  .stripe { height:6px; background: repeating-linear-gradient(-45deg, var(--gold) 0 18px, var(--pink) 18px 36px, var(--teal) 36px 54px); }
  .wrap { max-width: 420px; margin: 0 auto; padding: 20px; }
  .back { color:var(--muted); text-decoration:none; font-size:14px; }
  .cover { width:100%; aspect-ratio:1; object-fit:cover; border-radius:16px; margin: 16px 0; border:1px solid var(--line); }
  h1 { font-family:'Bebas Neue', sans-serif; letter-spacing:0.01em; font-size:28px; margin: 0 0 4px; }
  .meta { color:var(--muted); font-size:14px; margin-bottom: 16px; font-family:'Space Mono', monospace; }
  audio { width:100%; margin-bottom:20px; }
  .price { font-family:'Space Mono', monospace; font-size:26px; font-weight:700; color:var(--gold); margin-bottom:16px; }
  input[type=tel] { width:100%; padding:14px; border-radius:10px; border:1px solid var(--line); background:#150F1F; color:var(--text); font-size:16px; margin-bottom:12px; font-family:'Inter', sans-serif; }
  input[type=tel]:focus { outline:2px solid var(--gold); outline-offset:1px; border-color:transparent; }
  button { width:100%; padding:15px; border:none; border-radius:10px; background:var(--gold); color:#17110B; font-weight:700; font-size:16px; cursor:pointer; font-family:'Inter', sans-serif; }
  button:disabled { opacity:.6; cursor:default; }
  .status { text-align:center; margin-top:16px; font-size:14px; color:var(--muted); }
  .status.error { color: var(--pink); }
  .download-btn { display:block; text-align:center; margin-top:16px; padding:15px; background:var(--teal); color:#06231C; border-radius:10px; font-weight:700; text-decoration:none; font-family:'Inter', sans-serif; }
  .note { font-size:12px; color:var(--muted); margin-top:20px; text-align:center; }
</style>
</head>
<body>
<div class="stripe"></div>
<div class="wrap">
  <a class="back" href="/p/{{ producer['slug'] }}">← back to beats</a>
  <img class="cover" src="{{ beat['cover_path'] }}" alt="{{ beat['title'] }}" />
  <h1>{{ beat['title'] }}</h1>
  <div class="meta">
    {% if beat['genre'] %}{{ beat['genre'] }}{% endif %}
    {% if beat['bpm'] %} · {{ beat['bpm'] }} BPM{% endif %}
  </div>
  <audio controls src="{{ beat['audio_path'] }}"></audio>
  <div class="price">KES {{ beat['price'] }}</div>

  <div id="checkout-form">
    <input type="tel" id="phone" placeholder="M-Pesa number e.g. 07XXXXXXXX" />
    <button id="buy-btn" onclick="buyBeat()">Pay with M-Pesa</button>
  </div>
  <div id="status" class="status"></div>

  <p class="note">Preview only until purchase. Full download unlocks automatically once payment is confirmed.</p>
</div>

<script>
const beatId = {{ beat['id'] }};

async function buyBeat() {
  const phone = document.getElementById('phone').value.trim();
  const statusEl = document.getElementById('status');
  const btn = document.getElementById('buy-btn');
  if (!phone) { statusEl.textContent = 'Enter your M-Pesa number'; statusEl.className='status error'; return; }

  btn.disabled = true;
  btn.textContent = 'Sending prompt to your phone...';
  statusEl.className = 'status';
  statusEl.textContent = '';

  const res = await fetch(`/checkout/${beatId}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: `phone=${encodeURIComponent(phone)}`
  });
  const data = await res.json();
  statusEl.textContent = 'Check your phone and enter your M-Pesa PIN...';
  pollStatus(data.order_id, btn, statusEl);
}

function pollStatus(orderId, btn, statusEl) {
  const interval = setInterval(async () => {
    const res = await fetch(`/order/${orderId}/status`);
    const data = await res.json();
    if (data.status === 'completed') {
      clearInterval(interval);
      document.getElementById('checkout-form').style.display = 'none';
      statusEl.textContent = '';
      const link = document.createElement('a');
      link.href = `/download/${data.download_token}`;
      link.className = 'download-btn';
      link.textContent = '✓ Payment confirmed — Download your beat';
      document.body.querySelector('.wrap').insertBefore(link, document.querySelector('.note'));
    } else if (data.status === 'failed') {
      clearInterval(interval);
      statusEl.textContent = 'Payment failed or cancelled. Try again.';
      statusEl.className = 'status error';
      btn.disabled = false;
      btn.textContent = 'Pay with M-Pesa';
    }
  }, 2000);
}
</script>
</body>
</html>
