{% extends "base.html" %}{% block body %}<div style="max-width:500px;margin:60px auto" class="card"><h1>Forgot password?</h1><p class="muted">Enter your account email and we will send a secure reset link.</p>{% if error %}<p class="danger">{{error}}</p>{% endif %}{% if message %}<p>{{message}}</p>{% endif %}<form method="post"><input type="email" name="email" placeholder="Email" required><button>Send reset link</button></form></div>{% endblock %}
