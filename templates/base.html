<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Beat Hub{% endblock %}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><style>:root{--bg:#120e1a;--card:#1c1626;--line:#30253c;--ink:#f7f2ea;--muted:#9b92a6;--gold:#ffb800;--pink:#ff3d6e;--teal:#00d9a3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#ffb80012,transparent 28%),radial-gradient(circle at 90% 10%,#ff3d6e12,transparent 28%),var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}.stripe{height:7px;background:repeating-linear-gradient(-45deg,var(--gold) 0 18px,var(--pink) 18px 36px,var(--teal) 36px 54px)}a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:0 22px 70px}.brand{font:42px 'Bebas Neue';letter-spacing:1px}.brand span{color:var(--gold)}.nav{display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-bottom:1px solid var(--line)}.btn{display:inline-block;background:var(--gold);color:#17110b;border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.card{background:linear-gradient(145deg,#211a2c,#181320);border:1px solid var(--line);border-radius:16px;padding:20px}.muted{color:var(--muted)}input,textarea,select{width:100%;background:#130f1b;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);font:inherit}label{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:12px 0 6px}@media(max-width:700px){.wrap{padding:0 15px 45px}.brand{font-size:34px}}</style></head><body><div class="stripe"></div><div class="wrap">{% block body %}{% endblock %}</div></body></html>
