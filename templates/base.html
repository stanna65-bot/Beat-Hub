<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}BeatHub — The Home of Beats{% endblock %}</title><style>:root{--bg:#0b0b10;--card:#15151d;--text:#f5f5f7;--muted:#a4a4b0;--accent:#8b5cf6;--gold:#f59e0b;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:22px}.nav{display:flex;gap:16px;align-items:center;justify-content:space-between;border-bottom:1px solid #282832;padding:18px 0}.navlinks{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;font-size:22px;letter-spacing:1px}.brand span{color:var(--accent)}.btn,button{background:var(--accent);color:white;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}.alt{background:#252530}.card{background:var(--card);border:1px solid #282832;border-radius:14px;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.muted{color:var(--muted)}input,textarea,select{width:100%;margin:7px 0 14px;padding:12px;border-radius:9px;border:1px solid #383844;background:#101016;color:white}h1,h2,h3{margin-top:0}.hero{padding:70px 0}.hero h1{font-size:52px;margin-bottom:10px}.pill{display:inline-block;background:#242432;padding:5px 9px;border-radius:999px;font-size:12px}.amount{font-size:30px;font-weight:900}.danger{color:var(--danger)}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #292934;text-align:left}@media(max-width:650px){.hero h1{font-size:36px}.nav{align-items:flex-start}.navlinks{justify-content:flex-end}}</style></head><body><div class="wrap"><nav class="nav"><a class="brand" href="/">BEAT<span>HUB</span></a><div class="navlinks"><a href="/">Beats</a><a href="/#sessions">Sessions</a><a href="/#hot">Hot Picks</a><a href="/terms">Terms</a>{% if producer %}<a class="btn alt" href="/admin">Dashboard</a><form method="post" action="/logout"><button class="alt">Logout</button></form>{% else %}<a class="btn alt" href="/login">Login</a><a class="btn" href="/signup">Join BeatHub</a>{% endif %}</div></nav>{% block body %}{% endblock %}</div></body></html>
