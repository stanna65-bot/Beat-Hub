{% extends 'base.html' %}

{% block body %}
<div style="max-width:460px;margin:80px auto" class="card">

    <a class="brand" href="/">BEAT <span>HUB</span></a>

    <p class="muted">Super Admin Control Room</p>

    {% if error %}
    <p class="danger">{{ error }}</p>
    {% endif %}

    <form method="post" autocomplete="on">

        <label>Username</label>
        <input
            type="text"
            name="username"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
        >

        <label style="display:flex;align-items:center;gap:8px;margin:16px 0;cursor:pointer">
            <input
                type="checkbox"
                name="remember_me"
                value="true"
                style="width:auto"
            >
            <span>Remember me</span>
        </label>

        <button class="btn" type="submit">
            Secure login
        </button>

    </form>

</div>
{% endblock %}
