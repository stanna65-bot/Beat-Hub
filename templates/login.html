{% extends 'base.html' %}

{% block body %}
<div style="max-width:460px;margin:80px auto" class="card">

    <a class="brand" href="/">BEAT <span>HUB</span></a>

    <h1>Welcome back</h1>

    {% if error %}
    <p style="color:var(--pink)">{{ error }}</p>
    {% endif %}

    <form method="post" autocomplete="on">

        <label>Email</label>
        <input
            type="email"
            name="email"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
        >

        <label style="display:flex;align-items:center;gap:8px;margin:16px 0;cursor:pointer">
            <input
                type="checkbox"
                name="remember_me"
                value="true"
                style="width:auto"
            >
            <span>Remember me</span>
        </label>

        <button class="btn" type="submit">
            Login
        </button>

    </form>

    <p>
        <a href="/forgot-password">
            Forgot password?
        </a>
    </p>

    <p class="muted">
        New producer?
        <a href="/signup" style="color:var(--teal)">
            Create an account
        </a>
    </p>

</div>
{% endblock %}
