{% extends "base.html" %}{% block body %}<div style="max-width:650px;margin:45px auto" class="card"><h1>{{service.title}}</h1><p class="muted">{{service.producer_name}} · {{service.duration_minutes}} minutes · {{service.location}}</p><div class="amount">KES {{service.price}}</div><label>Date</label><input id="day" type="date" required><label>Available time</label><select id="slot" required><option>Select a date first</option></select><form id="book"><input name="client_name" placeholder="Your name" required><input name="client_phone" placeholder="M-Pesa number" required><input name="client_email" type="email" placeholder="Email (optional)"><input type="hidden" name="start_at" id="start"><button>Book & Pay</button></form><p id="msg"></p></div><script>day.min=new Date().toISOString().slice(0,10);day.onchange=async()=>{let d=await (await fetch('/api/services/{{service.id}}/slots?day='+day.value)).json();slot.innerHTML=d.length?d.map(x=>`<option value="${x.start_at}">${new Date(x.start_at).toLocaleString()}</option>`).join(''):'<option>No free sessions</option>';start.value=d[0]?.start_at||''};slot.onchange=()=>start.value=slot.value;book.onsubmit=async e=>{e.preventDefault();let x=await fetch('/sessions/{{service.id}}/book',{method:'POST',body:new FormData(book)}),d=await x.json();if(!x.ok){msg.textContent=d.detail||'Could not book';return}msg.textContent='Payment started. Reserving your selected time...';let t=setInterval(async()=>{let s=await (await fetch('/booking/'+d.booking_id+'/status')).json();if(s.status==='paid'||s.status==='confirmed'){clearInterval(t);location='/booking/'+d.booking_id}},1000)}</script>{% endblock %}
