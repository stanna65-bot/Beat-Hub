{% extends 'base.html' %}

{% block body %}
<div style="max-width:520px;margin:60px auto" class="card">

    <a class="brand" href="/">BEAT <span>HUB</span></a>

    <h1>Create your producer account</h1>

    <p class="muted">
        Join BeatHub and start sharing your beats, building your audience and earning from your music.
    </p>

    {% if error %}
    <p style="color:var(--pink)">{{ error }}</p>
    {% endif %}

    <form method="post" autocomplete="on">

        <label>Your producer / stage name</label>
        <input
            type="text"
            name="name"
            placeholder="e.g. Mr Mapema"
            autocomplete="name"
            required
        >

        <label>Email address</label>
        <input
            type="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="At least 8 characters"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <label>Confirm password</label>
        <input
            type="password"
            name="confirm_password"
            placeholder="Repeat your password"
            autocomplete="new-password"
            minlength="8"
            required
        >

        <label style="display:flex;align-items:flex-start;gap:10px;margin:18px 0;cursor:pointer">
            <input
                type="checkbox"
                name="accept_terms"
                value="true"
                required
                style="width:auto;margin-top:4px"
            >
            <span>
                I agree to the
                <a href="/terms" style="color:var(--teal)">Terms &amp; Conditions</a>.
            </span>
        </label>

        <button class="btn" type="submit">
            Create account
        </button>

    </form>

    <p class="muted" style="margin-top:20px">
        Already have an account?
        <a href="/login" style="color:var(--teal)">
            Login
        </a>
    </p>

</div>
{% endblock %}
