<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create your producer page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#120E1A; --card:#1C1626; --line:#2E2438; --gold:#FFB800; --pink:#FF3D6E; --teal:#00D9A3; --text:#F5F1E8; --muted:#8A8296; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: 'Inter', -apple-system, sans-serif; }
  .stripe { height:6px; background: repeating-linear-gradient(-45deg, var(--gold) 0 18px, var(--pink) 18px 36px, var(--teal) 36px 54px); }
  .wrap { max-width: 380px; margin: 0 auto; padding: 50px 24px; }
  h1 { font-family:'Bebas Neue', sans-serif; letter-spacing:0.02em; margin:0 0 6px; font-size:32px; }
  p.sub { color:var(--muted); font-size:14px; margin: 0 0 28px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  input { width: 100%; padding: 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-family: 'Inter', sans-serif; font-size: 15px; }
  input:focus { outline: 2px solid var(--gold); outline-offset: 1px; border-color: transparent; }
  button { width: 100%; margin-top: 24px; padding: 14px; border: none; border-radius: 8px; background: var(--gold); color: #17110B; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; font-size: 15px; }
  .error { background: #FF3D6E22; border: 1px solid var(--pink); color: var(--pink); padding: 11px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 6px; }
  .switch { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }
  .switch a { color: var(--teal); text-decoration: none; }
</style>
</head>
<body>
  <div class="stripe"></div>
  <div class="wrap">
    <h1>Create your page</h1>
    <p class="sub">You'll get your own link to share and a dashboard to manage beats and payouts.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/signup">
      <label>Producer / artist name</label>
      <input name="name" required maxlength="80" placeholder="e.g. Mr Mapema" />
      <label>Email</label>
      <input name="email" type="email" required maxlength="120" />
      <label>Password</label>
      <input name="password" type="password" required minlength="8" placeholder="At least 8 characters" />
      <button type="submit">Create my page</button>
    </form>
    <div class="switch">Already have an account? <a href="/login">Log in</a></div>
  </div>
</body>
</html>
