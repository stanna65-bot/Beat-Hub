{% extends "base.html" %}{% block body %}<p><a href="/p/{{producer['slug']}}">← Back</a></p><img src="{{beat['cover_path']}}" style="width:100%;max-width:420px"><h1>{{beat['title']}}</h1><p>{{beat['genre']}} · KES {{beat['price']}}</p><audio controls src="{{beat['audio_path']}}" style="width:100%"></audio><form id="buy"><input name="phone" placeholder="07XXXXXXXX" required><button>Pay with M-Pesa</button></form><p id="status"></p><script>document.getElementById('buy').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let r=await fetch('/checkout/{{beat["id"]}}',{method:'POST',body:new URLSearchParams(f)}),d=await r.json();if(!r.ok){status.textContent=d.detail||'Payment error';return}status.textContent='Check your phone...';let t=setInterval(async()=>{let x=await fetch('/order/'+d.order_id+'/status'),s=await x.json();if(s.status==='completed'){clearInterval(t);status.innerHTML='<a href="/download/'+s.download_token+'">Payment confirmed — Download</a>'}if(s.status==='failed'){clearInterval(t);status.textContent='Payment failed.'}},2000)}</script>{% endblock %}
